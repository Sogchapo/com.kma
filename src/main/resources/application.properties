spring.application.name=itmanagement

# Render Dynamic Port Configuration
server.port=${PORT:8080}

# Database Connection Configuration (H2 In-Memory Database for Cloud Deployment)
spring.datasource.url=jdbc:h2:mem:it_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: Enable H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true