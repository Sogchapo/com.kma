<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Profile - KMA IT Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Toast Notification -->
    <div th:if="${toastMessage}" x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 4000)"
         class="fixed top-5 right-5 z-50 flex items-center space-x-3 bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl border border-slate-700">
        <span th:if="${toastType == 'success'}" class="text-emerald-400">✅</span>
        <span th:if="${toastType == 'error'}" class="text-rose-400">🚨</span>
        <div class="text-sm font-medium pr-2" th:text="${toastMessage}">Notification</div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-800 text-white flex flex-col">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">Dashboard</a>
                <a th:href="@{/assets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">Assets Inventory</a>
                <a th:href="@{/requests}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">Item Requests</a>
                <a th:href="@{/tickets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">Helpdesk / Tickets</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">User Management</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/logs}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">Activity Logs</a>
            </nav>
        </div>

        <!-- Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-gray-800">User Profile Settings</h1>
            </header>

            <main class="p-8 max-w-2xl">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-6">
                    <h2 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-3">Avatar & Profile Image</h2>

                    <!-- Current Avatar Preview -->
                    <div class="flex items-center space-x-6">
                        <div class="relative">
                            <img th:if="${user != null and user.profileImage != null}" 
                                 th:src="@{'/uploads/avatars/' + ${user.profileImage}}" 
                                 alt="Profile Image" 
                                 class="w-24 h-24 rounded-full object-cover border-4 border-teal-500 shadow-md">
                            
                            <!-- Initial Fallback if No Photo Uploaded -->
                            <div th:unless="${user != null and user.profileImage != null}" 
                                 class="w-24 h-24 rounded-full bg-teal-500 text-white flex items-center justify-center font-bold text-3xl shadow-md"
                                 th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">
                                U
                            </div>
                        </div>

                        <div class="space-y-2">
                            <div>
                                <p class="font-bold text-gray-800 text-base" sec:authentication="name">Username</p>
                                <p class="text-xs text-gray-500">Upload a PNG, JPG, or GIF file for your profile avatar.</p>
                            </div>

                            <!-- Remove Avatar Form/Button -->
                            <form th:if="${user != null and user.profileImage != null}" 
                                  th:action="@{/profile/avatar/delete}" 
                                  method="post" class="inline-block">
                                <button type="submit" 
                                        onclick="return confirm('Are you sure you want to remove your profile avatar?');"
                                        class="text-xs font-semibold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg border border-rose-200 transition">
                                    🗑️ Remove Avatar
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Upload Form -->
                    <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Choose Image File</label>
                            <input type="file" name="avatar" accept="image/*" required 
                                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 border border-gray-300 rounded-lg p-2">
                        </div>

                        <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white font-semibold text-sm px-5 py-2.5 rounded-lg transition shadow-sm">
                            Upload & Save Avatar
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
