<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMA IT Portal - Add Asset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for mobile drawer toggle -->
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 font-sans" x-data="{ mobileMenuOpen: false }">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Mobile Sidebar Backdrop Overlay -->
        <div x-show="mobileMenuOpen" 
             @click="mobileMenuOpen = false"
             x-transition:enter="transition-opacity ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm lg:hidden"
             style="display: none;">
        </div>

        <!-- Sidebar Drawer -->
        <div :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
             class="fixed lg:static inset-y-0 left-0 w-64 bg-slate-800/95 backdrop-blur-md text-white flex flex-col z-50 border-r border-slate-700/50 transform transition-transform duration-300 ease-in-out">
            <div class="h-16 flex items-center justify-between px-6 border-b border-slate-700">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
                <!-- Mobile Menu Close Button -->
                <button @click="mobileMenuOpen = false" class="lg:hidden text-gray-400 hover:text-white text-lg">
                    ✕
                </button>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Dashboard
                </a>
                <a th:href="@{/assets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-teal-500 text-white">
                    Assets Inventory
                </a>
                <a th:href="@{/requests}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Item Requests
                </a>
                <a th:href="@{/tickets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Helpdesk / Tickets
                </a>
                
                <!-- ONLY VISIBLE TO ADMINS -->
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    User Management
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/logs}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Activity Logs
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-center text-xs text-gray-400">
                KMA IT MANAGEMENT SYSTEM &copy;  
            </div>
        </div>

        <!-- Main Content Panel Area -->
        <div class="flex-1 flex flex-col overflow-y-auto w-full">
            
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30 border-b border-gray-200/50">
                <div class="flex items-center space-x-3">
                    <!-- Hamburger Toggle Button (Mobile Only) -->
                    <button @click="mobileMenuOpen = true" class="lg:hidden p-2 text-gray-600 hover:text-teal-600 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-base sm:text-xl font-bold text-gray-800 truncate">Asset Management Center</h1>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-4">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-semibold text-gray-800" sec:authentication="name">Admin User</div>
                        <span sec:authorize="hasRole('ADMIN')" class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-purple-100 text-purple-700 border border-purple-200">
                            Admin
                        </span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-teal-500 text-white flex items-center justify-center font-bold text-xs sm:text-sm shadow-sm"
                         th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">
                        A
                    </div>
                </div>
            </header>

            <main class="p-4 sm:p-8 max-w-2xl mx-auto w-full">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 sm:p-6 bg-gray-50 border-b border-gray-100">
                        <h2 class="text-base sm:text-lg font-bold text-gray-800">Register New Hardware Asset</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Input system configurations to seed into the network inventory registry.</p>
                    </div>

                    <!-- Creation Form -->
                    <form th:action="@{/assets/new}" th:object="${asset}" method="POST" class="p-4 sm:p-6 space-y-5">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="name" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Asset Name / Model</label>
                                <input type="text" id="name" th:field="*{name}" required placeholder="e.g. HP ProBook 450 G10"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition text-sm">
                            </div>
                            <div>
                                <label for="type" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Device Type Category</label>
                                <select id="type" th:field="*{type}" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition text-sm">
                                    <option value="Laptop">Laptop</option>
                                    <option value="Desktop">Desktop</option>
                                    <option value="Server">Server Infrastructure</option>
                                    <option value="Networking">Networking Hardware</option>
                                    <option value="Printer">Printer / Scanner</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="assetTag" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Unique Asset Tag Code</label>
                                <input type="text" id="assetTag" th:field="*{assetTag}" required placeholder="e.g. KMA-LAP-2026-042"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition text-sm font-mono uppercase">
                            </div>
                            <div>
                                <label for="location" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Physical Location Room</label>
                                <input type="text" id="location" th:field="*{location}" required placeholder="e.g. Finance Dept - Room 12"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="status" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Initial Operational Status</label>
                            <select id="status" th:field="*{status}" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition text-sm">
                                <option value="Active">Active / Deployed</option>
                                <option value="Maintenance">Under Maintenance</option>
                                <option value="Stock">In Storage Repository</option>
                            </select>
                        </div>

                        <div class="pt-4 border-t border-gray-100 flex items-center justify-end space-x-3">
                            <a th:href="@{/assets}" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider text-gray-500 hover:bg-gray-100 transition">
                                Cancel
                            </a>
                            <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white text-xs font-bold py-2.5 px-5 rounded-lg transition tracking-wide uppercase shadow-sm">
                                Save Hardware Asset
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
