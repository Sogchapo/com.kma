<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KMA IT Portal - Open Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-slate-800 text-white flex flex-col">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Dashboard
                </a>
                <!-- FIXED DUPLICATE SIDEBAR ROUTE ROUTING LINK -->
                <a th:href="@{/assets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Assets
                </a>
                <a th:href="@{/tickets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-teal-500 text-white">
                    Helpdesk / Tickets
                </a>
                <a th:href="@{/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    User Management
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-center text-xs text-gray-400">
                KMA IT MANAGEMENT SYSTEM &copy; 2026
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Top Navbar -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-gray-800">Support Helpdesk</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-gray-600">Admin User</span>
                    <div class="w-8 h-8 rounded-full bg-teal-500 text-white flex items-center justify-center font-bold">A</div>
                </div>
            </header>

            <!-- Form Content -->
            <main class="p-8 max-w-2xl mx-auto w-full">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    
                    <div class="p-6 border-b border-gray-100 bg-gray-50">
                        <h2 class="text-lg font-bold text-gray-800">Submit IT Support Ticket</h2>
                        <p class="text-xs text-gray-500 mt-1">Please provide clear details regarding your technical issue or software request.</p>
                    </div>

                    <form th:action="@{/tickets/new}" th:object="${ticket}" method="POST" class="p-6 space-y-6">
                        
                        <!-- Row 1: Primary Incident Subject (Full Width) -->
                        <div>
                            <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">Incident Title</label>
                            <input type="text" id="title" th:field="*{title}" required placeholder="e.g., Core Switch Offline or Cannot Access Shared Drive"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
                        </div>

                        <!-- Row 2: Metadata Split (Submitter & Severity Level side-by-side) -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="submittedBy" class="block text-sm font-semibold text-gray-700 mb-2">Your Name & Department</label>
                                <input type="text" id="submittedBy" th:field="*{submittedBy}" required placeholder="e.g., Patricia Mensah (Finance)"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
                            </div>
                            <div>
                                <label for="priority" class="block text-sm font-semibold text-gray-700 mb-2">Severity Level</label>
                                <select id="priority" th:field="*{priority}" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
                                    <option value="Low">Low (General Inquiry)</option>
                                    <option value="Medium">Medium (Affects daily tasks)</option>
                                    <option value="High">High (Major operational hurdle)</option>
                                    <option value="Critical">Critical (System Outage)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Row 3: Description -->
                        <div>
                            <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">Description of the Incident</label>
                            <textarea id="description" th:field="*{description}" rows="4" required placeholder="Describe the steps leading to the failure or what support you need..."
                                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition"></textarea>
                        </div>

                        <!-- Form Actions -->
                        <div class="flex items-center justify-end space-x-4 border-t border-gray-100 pt-6">
                            <a th:href="@{/tickets}" class="px-5 py-2 text-sm font-semibold text-gray-600 hover:text-gray-800 transition">
                                Cancel
                            </a>
                            <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white text-sm font-semibold px-6 py-2 rounded-lg transition shadow-md">
                                Submit Ticket
                            </button>
                        </div>
                    </form>
                    
                </div>
            </main>
        </div>

    </div>

</body>
</html>
