<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage User - KMA IT Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 font-sans" x-data="{ mobileMenuOpen: false }">

    <!-- Toast Notification Banner -->
    <div th:if="${toastMessage}" 
         x-data="{ show: true }" 
         x-show="show" 
         x-init="setTimeout(() => show = false, 4000)"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-y-2 scale-95"
         x-transition:enter-end="opacity-100 transform translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 transform translate-y-2 scale-95"
         class="fixed top-5 right-5 z-50 flex items-center space-x-3 bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl border border-slate-700">
        <span th:text="${toastMessage}">Operation completed</span>
        <button @click="show = false" class="text-gray-400 hover:text-white text-xs ml-2">✕</button>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <!-- Mobile Sidebar Backdrop Overlay -->
        <div x-show="mobileMenuOpen" 
             @click="mobileMenuOpen = false"
             x-transition:enter="transition-opacity ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm lg:hidden"
             style="display: none;">
        </div>

        <!-- Sidebar Drawer -->
        <div :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
             class="fixed lg:static inset-y-0 left-0 w-64 bg-slate-800 text-white flex flex-col z-50 border-r border-slate-700/50 transform transition-transform duration-300 ease-in-out">
            <div class="h-16 flex items-center justify-between px-6 border-b border-slate-700">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
                <button @click="mobileMenuOpen = false" class="lg:hidden text-gray-400 hover:text-white text-lg">
                    ✕
                </button>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Dashboard
                </a>
                <a th:href="@{/assets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Assets Inventory
                </a>
                <a th:href="@{/requests}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Item Requests
                </a>
                <a th:href="@{/tickets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Helpdesk / Tickets
                </a>
                
                <!-- ONLY VISIBLE TO ADMINS -->
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-teal-500 text-white">
                    User Management
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/logs}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Activity Logs
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-center text-xs text-gray-400">
                KMA IT MANAGEMENT SYSTEM &copy;  
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto w-full">
            
            <!-- Top Header Bar -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30 border-b border-gray-200/50">
                <div class="flex items-center space-x-3">
                    <button @click="mobileMenuOpen = true" class="lg:hidden p-2 text-gray-600 hover:text-teal-600 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-base sm:text-xl font-bold text-gray-800 truncate">Account Administration</h1>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-4">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-semibold text-gray-800" sec:authentication="name">User</div>
                        <span sec:authorize="hasRole('ADMIN')" class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-purple-100 text-purple-700 border border-purple-200">Admin</span>
                        <span sec:authorize="hasRole('USER')" class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-blue-100 text-blue-700 border border-blue-200">Staff</span>
                    </div>

                    <!-- Profile Avatar Link -->
                    <a th:href="@{/profile}" class="flex-shrink-0">
                        <img th:if="${user != null and user.profileImage != null}" 
                             th:src="@{'/uploads/avatars/' + ${user.profileImage}}" 
                             alt="Profile Avatar" 
                             class="w-8 h-8 rounded-full object-cover border-2 border-teal-500 shadow-sm hover:opacity-90 transition">
                        <div th:unless="${user != null and user.profileImage != null}" 
                             class="w-8 h-8 rounded-full bg-teal-500 text-white flex items-center justify-center font-bold text-xs sm:text-sm shadow-sm hover:opacity-90 transition"
                             th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">
                            U
                        </div>
                    </a>

                    <form th:action="@{/logout}" method="post" class="inline ml-1">
                        <button type="submit" class="text-xs font-semibold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition border border-rose-200">Logout</button>
                    </form>
                </div>
            </header>

            <!-- Main Workspace Container -->
            <main class="p-4 sm:p-8 flex items-center justify-center flex-1 w-full">
                <div class="w-full max-w-xl bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200">
                    
                    <!-- Form Title Block -->
                    <div class="mb-6 border-b border-gray-100 pb-4 flex justify-between items-start">
                        <div>
                            <h2 class="text-lg sm:text-xl font-bold text-gray-800" 
                                th:text="${user.id != null ? 'Edit User Account' : 'Create New User Account'}">
                                User Account
                            </h2>
                            <p class="text-xs text-gray-500 mt-1">Configure user credentials, department details, and system roles.</p>
                        </div>
                        <a th:href="@{/users}" class="text-xs text-gray-400 hover:text-gray-600 transition">✕ Cancel</a>
                    </div>

                    <!-- Form Fields -->
                    <form th:action="@{/users/save}" th:object="${user}" method="post" class="space-y-4">
                        <input type="hidden" th:field="*{id}" />

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                                <input type="text" th:field="*{username}" required 
                                       class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                                <input type="password" th:field="*{password}" 
                                       th:placeholder="${user.id != null ? 'Leave blank to keep unchanged' : 'Enter account password'}"
                                       class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                            <input type="text" th:field="*{fullName}" required
                                   class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
                                <input type="email" th:field="*{email}" 
                                       class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Department</label>
                                <input type="text" th:field="*{department}" 
                                       class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">System Role</label>
                                <select th:field="*{role}" class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition cursor-pointer">
                                    <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                                    <option value="ROLE_USER">ROLE_USER</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Status</label>
                                <select th:field="*{status}" class="w-full px-4 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none transition cursor-pointer">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>

                        <!-- Form Action Buttons -->
                        <div class="flex justify-end space-x-3 pt-6 border-t border-gray-100 mt-6">
                            <a th:href="@{/users}" class="px-4 py-2 bg-gray-100 text-gray-700 text-xs font-semibold rounded-lg hover:bg-gray-200 transition">
                                Cancel
                            </a>
                            <button type="submit" class="px-4 py-2 bg-teal-500 text-white text-xs font-semibold rounded-lg hover:bg-teal-600 transition shadow-sm">
                                Save User Profile
                            </button>
                        </div>
                    </form>

                </div>
            </main>
        </div>

    </div>

</body>
</html>
