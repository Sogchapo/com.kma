<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage User - KMA IT Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-lg bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
        <!-- Header -->
        <div class="mb-6 border-b border-gray-100 pb-4">
            <h2 class="text-xl font-bold text-gray-800" 
                th:text="${user.id != null ? 'Edit User Account' : 'Create New User Account'}">
                User Account
            </h2>
            <p class="text-xs text-gray-500 mt-1">Configure user access credentials and portal roles.</p>
        </div>

        <!-- Form -->
        <form th:action="@{/users/save}" th:object="${user}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                <input type="text" th:field="*{username}" required 
                       class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" th:field="*{password}" 
                       th:placeholder="${user.id != null ? 'Leave blank to keep unchanged' : 'Enter account password'}"
                       class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" th:field="*{fullName}" 
                       class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
                <input type="email" th:field="*{email}" 
                       class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Department</label>
                <input type="text" th:field="*{department}" 
                       class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">System Role</label>
                    <select th:field="*{role}" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                        <option value="ROLE_USER">ROLE_USER</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Status</label>
                    <select th:field="*{status}" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end space-x-3 pt-6 border-t border-gray-100 mt-6">
                <a th:href="@{/users}" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-200 transition">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-2 bg-teal-500 text-white text-sm font-semibold rounded-lg hover:bg-teal-600 transition shadow-sm">
                    Save User
                </button>
            </div>
        </form>
    </div>

</body>
</html>
