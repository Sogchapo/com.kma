<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KMA IT Portal - Add New Asset</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-slate-800 text-white flex flex-col">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Dashboard
                </a>
                <!-- Active Link (Assets Action) -->
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-teal-500 text-white">
                    Assets
                </a>
                <!-- Link to Tickets -->
                <a th:href="@{/tickets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Helpdesk / Tickets
                </a>
                <a th:href="@{/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    User Management
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-center text-xs text-gray-400">
                KMA IT MANAGEMENT SYSTEM &copy; 2026
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Top Navbar -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-gray-800">Asset Management</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-gray-600">Admin User</span>
                    <div class="w-8 h-8 rounded-full bg-teal-500 text-white flex items-center justify-center font-bold">A</div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="p-8 max-w-2xl mx-auto w-full">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    
                    <!-- Form Header -->
                    <div class="p-6 border-b border-gray-100 bg-gray-50">
                        <h2 class="text-lg font-bold text-gray-800">Register New IT Asset</h2>
                        <p class="text-xs text-gray-500 mt-1">Add hardware, servers, or components to the KMA asset repository.</p>
                    </div>

                    <!-- Registration Form -->
                    <form th:action="@{/assets/add}" th:object="${asset}" method="POST" class="p-6 space-y-6">
                        
                        <!-- Row 1: Asset Name -->
                        <div>
                            <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Asset Name / Model</label>
                            <input type="text" id="name" th:field="*{name}" required placeholder="e.g., HP EliteBook 840, Cisco Router 2901"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
                        </div>

                        <!-- Row 2: Tag & Type -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="assetTag" class="block text-sm font-semibold text-gray-700 mb-2">Asset Tag ID (Unique)</label>
                                <input type="text" id="assetTag" th:field="*{assetTag}" required placeholder="e.g., KMA-LAP-003"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
                            </div>
                            <div>
                                <label for="type" class="block text-sm font-semibold text-gray-700 mb-2">Device Type</label>
                                <select id="type" th:field="*{type}" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
                                    <option value="Laptop">Laptop</option>
                                    <option value="Desktop">Desktop</option>
                                    <option value="Server">Server</option>
                                    <option value="Printer">Printer</option>
                                    <option value="Switch">Switch</option>
                                    <option value="Router">Router</option>
                                </select>
                            </div>
                        </div>

                        <!-- Row 3: Status & Location -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="status" class="block text-sm font-semibold text-gray-700 mb-2">Current Status</label>
                                <select id="status" th:field="*{status}" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
                                    <option value="Active">Active</option>
                                    <option value="Under Repair">Under Repair</option>
                                    <option value="Retired">Retired</option>
                                </select>
                            </div>
                            <div>
                                <label for="location" class="block text-sm font-semibold text-gray-700 mb-2">Deployment Location / Dept</label>
                                <input type="text" id="location" th:field="*{location}" placeholder="e.g., HR Office, Server Room"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
                            </div>
                        </div>

                        <!-- Row 4: Purchase Date -->
                        <div>
                            <label for="purchaseDate" class="block text-sm font-semibold text-gray-700 mb-2">Purchase Date</label>
                            <input type="date" id="purchaseDate" th:field="*{purchaseDate}"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
                        </div>

                        <!-- Form Actions -->
                        <div class="flex items-center justify-end space-x-4 border-t border-gray-100 pt-6">
                            <a th:href="@{/}" class="px-5 py-2 text-sm font-semibold text-gray-600 hover:text-gray-800 transition">
                                Cancel
                            </a>
                            <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white text-sm font-semibold px-6 py-2 rounded-lg transition shadow-md">
                                Save Asset
                            </button>
                        </div>
                    </form>
                    
                </div>
            </main>
        </div>

    </div>

</body>
</html>
