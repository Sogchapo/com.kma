<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="sidebar(activePage)"
         :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
         class="fixed lg:static inset-y-0 left-0 w-64 bg-slate-800/95 backdrop-blur-md text-white flex flex-col z-50 border-r border-slate-700/50 transform transition-transform duration-300 ease-in-out">
        
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-700">
            <div class="flex items-center space-x-3">
                <img th:src="@{/images/kmalogo.jpeg}" alt="KMA Logo" class="w-8 h-8 rounded-full object-cover border border-teal-400/50 shadow-sm">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
            </div>
            <button @click="mobileMenuOpen = false" class="lg:hidden text-gray-400 hover:text-white text-lg">✕</button>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'bg-teal-500 text-white' : 'hover:bg-slate-700 text-gray-300'" class="flex items-center space-x-3 px-4 py-2.5 text-sm font-medium rounded-lg transition">
                <span class="text-lg">📊</span>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/assets}" th:classappend="${activePage == 'assets'} ? 'bg-teal-500 text-white' : 'hover:bg-slate-700 text-gray-300'" class="flex items-center space-x-3 px-4 py-2.5 text-sm font-medium rounded-lg transition">
                <span class="text-lg">🖥️</span>
                <span>Assets Inventory</span>
            </a>
            <a th:href="@{/requests}" th:classappend="${activePage == 'requests'} ? 'bg-teal-500 text-white' : 'hover:bg-slate-700 text-gray-300'" class="flex items-center space-x-3 px-4 py-2.5 text-sm font-medium rounded-lg transition">
                <span class="text-lg">📦</span>
                <span>Item Requests</span>
            </a>
            <a th:href="@{/tickets}" th:classappend="${activePage == 'tickets'} ? 'bg-teal-500 text-white' : 'hover:bg-slate-700 text-gray-300'" class="flex items-center space-x-3 px-4 py-2.5 text-sm font-medium rounded-lg transition">
                <span class="text-lg">🎫</span>
                <span>Helpdesk / Tickets</span>
            </a>
            
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" th:classappend="${activePage == 'users'} ? 'bg-teal-500 text-white' : 'hover:bg-slate-700 text-gray-300'" class="flex items-center space-x-3 px-4 py-2.5 text-sm font-medium rounded-lg transition">
                <span class="text-lg">👥</span>
                <span>User Management</span>
            </a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/logs}" th:classappend="${activePage == 'logs'} ? 'bg-teal-500 text-white' : 'hover:bg-slate-700 text-gray-300'" class="flex items-center space-x-3 px-4 py-2.5 text-sm font-medium rounded-lg transition">
                <span class="text-lg">📋</span>
                <span>Activity Logs</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700 text-center text-xs text-gray-400">
            KMA IT MANAGEMENT SYSTEM &copy;Designed by SoG  
        </div>
    </div>
</body>
</html>
