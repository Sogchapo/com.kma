<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User Activity Logs - KMA IT Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-slate-800 text-white flex flex-col">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <span class="text-xl font-bold tracking-wider text-teal-400">KMA IT Portal</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a th:href="@{/}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Dashboard
                </a>
                <a th:href="@{/assets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Assets Inventory
                </a>
                <a th:href="@{/requests}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Item Requests
                </a>
                <a th:href="@{/tickets}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    Helpdesk / Tickets
                </a>
                
                <!-- ADMIN ONLY MENU -->
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    User Management
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/logs}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-teal-500 text-white">
                    Activity Logs
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-center text-xs text-gray-400">
                KMA IT MANAGEMENT SYSTEM &copy; 2026
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-gray-800">User Activity Logs</h1>
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-800" sec:authentication="name">Admin</div>
                        <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-purple-100 text-purple-700 border border-purple-200">Admin</span>
                    </div>
                </div>
            </header>

            <main class="p-8 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800">Staff Login & Logout Audit Trail</h2>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                                    <th class="py-3.5 px-6 font-semibold">User</th>
                                    <th class="py-3.5 px-6 font-semibold">Action</th>
                                    <th class="py-3.5 px-6 font-semibold">IP Address</th>
                                    <th class="py-3.5 px-6 font-semibold">Timestamp</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm text-gray-700">
                                <tr th:each="log : ${logs}" class="hover:bg-gray-50 transition">
                                    <td class="py-4 px-6 font-semibold text-gray-900" th:text="${log.username}">username</td>
                                    <td class="py-4 px-6">
                                        <span th:text="${log.action}" 
                                              th:classappend="${log.action == 'LOGIN' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}"
                                              class="px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
                                            ACTION
                                        </span>
                                    </td>
                                    <td class="py-4 px-6 font-mono text-xs text-gray-500" th:text="${log.ipAddress}">127.0.0.1</td>
                                    <td class="py-4 px-6 text-xs text-gray-600" th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">Date</td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(logs)}">
                                    <td colspan="4" class="py-12 text-center text-gray-400 bg-gray-50/50">
                                        <p class="text-sm font-medium">No activity logged yet.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
