<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - KMA IT Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-6">
        
        <!-- Header / Logo -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-teal-600 tracking-wider">KMA IT PORTAL</h1>
            
        </div>

        <!-- Alert Messages -->
        <div th:if="${param.error}" class="bg-rose-50 border border-rose-200 text-rose-700 text-xs px-4 py-3 rounded-lg text-center">
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs px-4 py-3 rounded-lg text-center">
            You have been successfully logged out.
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                <input type="text" name="username" required autofocus 
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <button type="submit" 
                    class="w-full bg-teal-500 hover:bg-teal-600 text-white font-semibold py-2.5 rounded-lg transition shadow-md">
                Sign In
            </button>
        </form>

        <div class="border-t border-gray-100 pt-4 text-center text-xs text-gray-400">
            KMA IT MANAGEMENT SYSTEM &copy; 2026
        </div>

    </div>

</body>
</html>
