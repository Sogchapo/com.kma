<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KMA IT Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-no-repeat bg-center bg-cover bg-fixed flex items-center justify-center p-4 sm:p-6 font-sans relative overflow-x-hidden"
      th:style="'background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url(' + @{/images/kma1.jpg} + ');'">

    <!-- Main Split Card Container -->
    <div class="w-full max-w-4xl bg-white rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 min-h-[480px] sm:min-h-[520px] relative z-10 border border-white/20">
        
        <!-- Left Side: Image Panel (Desktop Only) -->
        <div class="relative hidden md:block bg-cover bg-center"
             th:style="'background-image: url(' + @{/images/kma8.jpg} + ');'">
            <!-- Dark Gradient Overlay for Text Readability -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-black/40 p-8 flex flex-col justify-between">
                <div>
                    <span class="text-white font-extrabold tracking-widest text-lg uppercase">KMA IT PORTAL</span>
                </div>
                <div>
                    <p class="text-gray-300 text-xs mt-2">Kumasi Metropolitan Assembly Internal Portal</p>
                </div>
            </div>
        </div>

        <!-- Right Side: Login Form Panel -->
        <div class="p-6 sm:p-8 md:p-12 flex flex-col justify-between bg-white">
            
            <div>
                <!-- Mobile Branding Badge -->
                <div class="md:hidden text-center mb-4">
                    <span class="text-teal-600 font-extrabold tracking-widest text-sm uppercase">KMA IT PORTAL</span>
                </div>

                <!-- Header -->
                <div class="text-center md:text-left mb-6">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800">Sign In</h2>
                    <p class="text-xs text-gray-500 mt-1">Enter your credentials to access your account</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${param.error}" class="mb-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs px-4 py-3 rounded-xl text-center font-medium">
                    Invalid username or password. Please try again.
                </div>
                <div th:if="${param.logout}" class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs px-4 py-3 rounded-lg text-center font-medium">
                    You have been successfully logged out.
                </div>

                <!-- Form -->
                <form th:action="@{/login}" method="post" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                        <input type="text" name="username" placeholder="Enter your username" required autofocus 
                               class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                        <input type="password" name="password" placeholder="••••••••" required 
                               class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none transition">
                    </div>

                    <button type="submit" 
                            class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-teal-600/30 text-sm mt-2">
                        Sign In
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="pt-6 text-center text-[10px] sm:text-xs text-gray-400 border-t border-gray-100 mt-6 leading-tight">
                KMA IT MANAGEMENT SYSTEM &copy; 2026<br class="sm:hidden" />
                <span class="hidden sm:inline"> - </span>DESIGNED BY SOG TECH SOLUTIONS
            </div>

        </div>

    </div>

</body>
</html>
